<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Codex</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      color: #ffffff;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    button {
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a1a1a;
      background: #f8f9fa;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.6);
    }

    button:active {
      transform: translateY(1px);
    }

    button.glow-active {
      background: #1a2a6c;
      color: #ffffff;
      box-shadow: 0 0 35px rgba(26, 42, 108, 0.7);
    }
  </style>
</head>
<body>
  <h1>Welcome to Codex</h1>
  <button id="glowButton">Click Me</button>

  <script>
    const button = document.getElementById('glowButton');
    button.addEventListener('click', () => {
      button.classList.toggle('glow-active');
    });
  </script>
</body>
</html>
